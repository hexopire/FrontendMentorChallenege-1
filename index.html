<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Weather Dashboard</title>
</head>

<body class="bg-indigo-900 flex flex-col justify-center items-center px-40 py-10">
    <nav class="flex py-10 justify-between w-full">
        <div class="w-[150px]">
            <img src="assets/images/logo.svg" alt="logo" />
        </div>
        <!-- <button class="flex bg-gray-500 px-4 py-2 rounded-lg text-center w-[120px] gap-3">
            <img src="assets/images/icon-units.svg" alt="icon-units" />
            <p class="text-white">Units</p>
            <img src="assets/images/icon-checkmark.svg" alt="icon-checkmark" />
        </button> -->
    </nav>

    <h1 class="text-center text-white text-5xl font-bold font-sans pb-15">
        How's the sky Looking today?
    </h1>

    <div class="text-center mb-10">
        <input id="city-input" type="text" placeholder="Search for a place..."
            class="w-[500px] p-4 bg-gray-800 rounded-lg text-white" />
        <button id="search-btn" class="bg-blue-700 px-6 py-4 rounded-xl font-bold text-white ml-2 hover:bg-blue-400">
            Search
        </button>
    </div>

    <div class="grid grid-cols-[1fr_350px] gap-6 w-full max-w-6xl p-6 text-white ">
        <div class="flex flex-col gap-8">
            <div class="h-64 bg-blue-600 rounded-3xl overflow-hidden relative">
                <img src="assets/images/bg-today-large.svg" alt="background" class="w-full h-full object-cover" />
                <div class="absolute inset-0 flex items-center justify-between p-8">
                    <div class="flex flex-col">
                        <h1 id="city-display" class="text-3xl font-bold text-white px-4 py-1">
                            Berlin, Germany
                        </h1>
                        <p id="current-date" class="text-md text-white/80 px-4">Loading date...</p>
                    </div>

                    <div class="flex flex-row gap-3 justify-center items-center">
                        <img src="assets/images/icon-sunny.webp" alt="icon" class="w-25 h-25" />
                        <h1 id="current-temp" class="text-7xl text-white">--°</h1>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-4">
                <div class="bg-slate-900 h-32 rounded-2xl p-4 flex flex-col gap-5">
                    <p>Feels Like</p>
                    <h1 id="feels-like" class="text-3xl font-bold">--°C</h1>
                </div>
                <div class="bg-slate-900 h-32 rounded-2xl p-4 flex flex-col gap-5">
                    <p>Humidity</p>
                    <h1 id="humidity" class="text-3xl font-bold">--%</h1>
                </div>
                <div class="bg-slate-900 h-32 rounded-2xl p-4 flex flex-col gap-5">
                    <p>Wind</p>
                    <h1 id="wind-speed" class="text-3xl font-bold">--km/h</h1>
                </div>
                <div class="bg-slate-900 h-32 rounded-2xl p-4 flex flex-col gap-5">
                    <p>Precipitation</p>
                    <h1 id="precip" class="text-3xl font-bold">0mm</h1>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <p class="text-xl font-semibold">Daily forecast</p>
                <div id="daily-container" class="flex flex-row gap-3 h-40 ">
                </div>
            </div>
        </div>

        <div class="bg-slate-900 rounded-3xl p-6">
            <div class="flex justify-between items-center  p-3">
                <p class="font-semibold ">Hourly forecast</p>
                <div class="relative inline-block">
                    <button id="dropdown-btn"
                        class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 transition-colors">
                        <span id="btn-txt">Monday</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                
                    <ul id="dropdown-menu"
                        class="hidden absolute left-0 mt-2 w-40 bg-slate-800 border border-slate-700 rounded-xl shadow-xl z-50 overflow-hidden">
                        
                    </ul>
                </div>
            </div>
            <div id="hourly-container"
                class="space-y-4 pt-6 h-[564px] overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-gray-800 [&::-webkit-scrollbar-thumb]:bg-gray-500 [&::-webkit-scrollbar-thumb]:rounded-full">
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
